exp_1:
  epochs: 60
  batch_size: 256
  learning_rate_vit: 1e-4
  learning_rate_cnn: 1e-3
  fractions: [0.05, 0.1, 0.25, 0.5, 1.0]
  base_vit_config:
    img_size: 32
    patch_size: 4
    embed_dim: 192
    depth: 12
    num_heads: 3
    mlp_ratio: 4
    use_cls_token: true
    pos_embed_type: learnable

